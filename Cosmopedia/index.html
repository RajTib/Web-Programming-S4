<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Cosmopedia — An interactive digital encyclopedia of our solar system">
  <title>Cosmopedia | Interactive Solar System Encyclopedia</title>

  <!-- Preconnect for fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Main CSS -->
  <link rel="stylesheet" href="styles/main.css">

  <!-- Favicon via emoji (quick inline SVG) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪐</text></svg>">
</head>

<body>
  <!-- ═══════════════════════════════════════════════════
       STARS CANVAS (fixed background layer)
  ═══════════════════════════════════════════════════ -->
  <canvas id="starsCanvas" aria-hidden="true"></canvas>

  <!-- ═══════════════════════════════════════════════════
       APP SHELL
  ═══════════════════════════════════════════════════ -->
  <div id="app">

    <!-- ─── NAVBAR ──────────────────────────────────── -->
    <nav class="navbar" role="navigation" aria-label="Main navigation">
      <!-- Logo -->
      <span class="navbar__logo" onclick="window.router?.navigate('/')" role="link" tabindex="0">
        🪐 COSMOPEDIA
      </span>

      <!-- Desktop links -->
      <div class="navbar__links">
        <button class="nav-link" data-route="/" onclick="window.router?.navigate('/')">Home</button>
        <button class="nav-link" data-route="/explore" onclick="window.router?.navigate('/explore')">Explore</button>
        <button class="nav-link" data-route="/solar-system" onclick="window.router?.navigate('/solar-system')">Solar System</button>
        <button class="nav-link" data-route="/compare" onclick="window.router?.navigate('/compare')">Compare</button>
        <button class="nav-link" data-route="/favorites" onclick="window.router?.navigate('/favorites')">★ Favorites</button>
      </div>

      <!-- Actions -->
      <div class="navbar__actions">
        <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="Toggle theme" aria-label="Toggle light/dark theme">
          ☀️
        </button>
        <button class="navbar__hamburger" id="hamburger" aria-label="Toggle mobile menu">☰</button>
      </div>

      <!-- Mobile dropdown -->
      <div class="navbar__mobile" id="mobileMenu" role="menu">
        <button class="nav-link" onclick="window.router?.navigate('/')">🏠 Home</button>
        <button class="nav-link" onclick="window.router?.navigate('/explore')">🚀 Explore All</button>
        <button class="nav-link" onclick="window.router?.navigate('/solar-system')">🪐 Solar System</button>
        <button class="nav-link" onclick="window.router?.navigate('/compare')">⚖️ Compare</button>
        <button class="nav-link" onclick="window.router?.navigate('/favorites')">★ Favorites</button>
      </div>
    </nav>

    <!-- ─── MAIN CONTENT ────────────────────────────── -->
    <main id="content" role="main" aria-live="polite">
      <!-- SPA content injected here by router -->
      <div style="display:flex;align-items:center;justify-content:center;height:60vh;flex-direction:column;gap:1rem;">
        <div style="font-size:3rem;">🪐</div>
        <div style="font-family:'Orbitron',sans-serif;color:#4a9eff;">Loading Cosmopedia...</div>
      </div>
    </main>

    <!-- ─── FOOTER ──────────────────────────────────── -->
    <footer>
      <p>
        🪐 <strong>Cosmopedia</strong> — An Interactive Solar System Encyclopedia &nbsp;|&nbsp;
        Data from <a href="https://api.nasa.gov" target="_blank" rel="noopener">NASA Open APIs</a> &nbsp;|&nbsp;
        © 2026
      </p>
    </footer>

  </div>

  <!-- ═══════════════════════════════════════════════════
       SCRIPTS (ES Modules)
  ═══════════════════════════════════════════════════ -->
  <script type="module" src="scripts/app.js"></script>
</body>

</html>
