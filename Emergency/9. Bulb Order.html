<!DOCTYPE html>
<html>

<body>

    Name:
    <input id="name"><br><br>

    <input type="checkbox" id="b1"> Four 100W bulbs Rs 20.39
    <input type="number" id="q1" value="0"><br>

    <input type="checkbox" id="b2"> Eight 100W bulbs Rs 40.20
    <input type="number" id="q2" value="0"><br>

    <button onclick="calculate()">Submit</button>

    <div id="result"></div>

    <script>
        function calculate() {

            let total = 0;

            if (b1.checked)
                total += 20.39 * q1.value;

            if (b2.checked)
                total += 40.20 * q2.value;

            let vat = total * 0.135;
            let final = total + vat;

            document.getElementById("result").innerHTML = "Total with VAT: " + final;
        }
    </script>

</body>

</html>
