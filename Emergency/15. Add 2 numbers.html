<input id="x">
<input id="y">

<button onclick="add()">Calculate</button>

<p id="output"></p>

<script>
    function add() {
        let x = parseInt(document.getElementById("x").value);
        let y = parseInt(document.getElementById("y").value);

        document.getElementById("output").innerHTML = "Output: " + (x + y);
    }
</script>
